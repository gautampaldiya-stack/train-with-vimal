# Local stack: Postgres, Redis, API (HTTP + WebSocket), Celery worker and beat.
#   docker compose up --build
#   docker compose exec api python manage.py seed_defaults
#   docker compose exec api python manage.py seed_demo
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: twv
      POSTGRES_PASSWORD: twv
      POSTGRES_DB: twv
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: ./backend
    env_file: ./backend/.env
    environment: &env
      DATABASE_URL: postgres://twv:twv@db:5432/twv
      REDIS_URL: redis://redis:6379/0
      CHANNELS_REDIS_URL: redis://redis:6379/2
    command: sh -c "python manage.py migrate && uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload"
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]
    depends_on: [db, redis]
  worker:
    build: ./backend
    env_file: ./backend/.env
    environment: *env
    command: celery -A config worker -l info
    volumes: ["./backend:/app"]
    depends_on: [db, redis]
  beat:
    build: ./backend
    env_file: ./backend/.env
    environment: *env
    command: celery -A config beat -l info
    volumes: ["./backend:/app"]
    depends_on: [db, redis]
volumes:
  pgdata:
