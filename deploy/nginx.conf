# One site, one domain (twv.prowavetech.in): the Flutter web app plus the API behind the same address.
# CloudPanel's reverse proxy site sends everything to this container (127.0.0.1:8080), which does the rest.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 300M;   # Library videos
    root /usr/share/nginx/html;

    # Docker's DNS, asked again every 10 s: when a deploy or `up -d` makes a new api container (new address),
    # nginx finds it by itself instead of answering 502 until `restart web`.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API, live notifications, uploads, admin pages, API docs, health check → Django (api container)
    location ~ ^/(api|ws|media|static|django-admin|health)(/|$) {
        set $api http://api:8000;
        proxy_pass $api;   # no URI part: the request path goes through as it is
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;   # keeps a port, so absolute upload links are right
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;    # WebSocket stays open
        proxy_request_buffering off; # big uploads stream through
    }

    # The app's own files: never cache index.html / service worker, cache the rest (file names change per build)
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
    # Web push worker + its Firebase keys: a phone must never keep an old copy (D-80)
    location = /firebase-messaging-sw.js { add_header Cache-Control "no-cache"; }
    location = /firebase-config.js { add_header Cache-Control "no-cache"; }

    # Any app page (/clients/…, /settings) opens the app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
