<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = {}; }
  renderVals() {
    const st = this.state;

    const SL = [{"k": "WHY IT MATTERS", "t": "Good health is your real wealth", "s": "More energy for work and family, better sleep and a calmer mind. A strong body makes every day easier.", "pts": [{"a": "Energy", "b": "for the whole day"}, {"a": "Sleep", "b": "deeper and longer"}, {"a": "Mood", "b": "less stress"}]}, {"k": "SMALL STEPS", "t": "Small steps, every single day", "s": "You do not need a perfect week. Train a little, eat right, drink water and sleep well. It adds up fast.", "pts": [{"a": "Train", "b": "3–5 days a week"}, {"a": "Eat", "b": "simple, home food"}, {"a": "Rest", "b": "7–8 hours"}]}, {"k": "MEET YOUR COACH", "t": "Hi, I’m Vimal", "s": "Certified nutritionist and personal trainer. I help people build strength and muscle the natural way, fully online.", "pts": [{"a": "10+", "b": "years coaching"}, {"a": "300+", "b": "transformations"}, {"a": "17,000+", "b": "followers"}]}, {"k": "HOW IT WORKS", "t": "Your plan, made for you", "s": "Tell us about you once. Your coach builds your workouts and meals, you log them here, and we check in every week.", "pts": [{"a": "1", "b": "Answer a few questions"}, {"a": "2", "b": "Get your plan"}, {"a": "3", "b": "Log and check in"}]}];
    const i = st.i || 0, n = SL.length, s = SL[i], dir = st.dir || 'n';
    const to = (k) => { if (k < 0 || k >= n || k === i) return; this.setState({ i: k, dir: k > i ? 'n' : 'p', ak: (st.ak || 0) + 1 }); };
    const g = Object.assign({ k: s.k, t: s.t, s: s.s, pts: s.pts, ptCls: i >= 2 ? 'num' : '',
      anim: 'in-' + dir + ((st.ak || 0) % 2 ? ' b' : ' a'), hasBack: i > 0, notLast: i < n - 1, last: i === n - 1,
      next: () => to(i + 1), back: () => to(i - 1),
      dots: SL.map((_, k) => ({ cls: k === i ? 'on' : '', lab: 'Slide ' + (k + 1) + ' of ' + n, go: () => to(k) })) },
      Object.fromEntries(SL.map((_, k) => ['i' + k, k === i])));
    return { g };
  }
}
</script>
